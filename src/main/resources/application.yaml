spring:
  application:
    name: backend-api

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
      jakarta:
        persistence:
          sharedCache:
            mode: ENABLE_SELECTIVE
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload-dir: uploads

jwt:
  secret: "your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-please-change-this-in-production"
  expiration: 3600000
  refresh-expiration: 604800000

server:
  servlet:
    context-path: /

# Swagger UI Configuration (Springdoc OpenAPI)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: true
    urls-primary-name: "API"
  show-actuator: false
  # Context path 무시하고 루트 경로에서 제공
  use-management-port: false
